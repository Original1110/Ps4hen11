<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة أورجينال أسيوط - ش الجمهورية - بجوار فرع فودافون</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* جعل الخلفية متناسبة تماماً مع أي شاشة */
    body {
      background-image: url('icon0.jpg'); /* ضع اسم صورتك هنا */
      background-size: 100% 95%;          /* تغطية الشاشة بالكامل */
      background-position: center;      /* تمركز الصورة */
      background-repeat: no-repeat;    /* عدم التكرار */
      background-attachment: fixed;    /* ثبات الخلفية */
      background-color: #1a1a24;

      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    /* كارت زجاجي مخصص للتحكم */
    .container {
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #4facfe;
    }

    h3 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #00f2fe;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      margin: 15px 0 25px 0;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    #kernel-options {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 20px;
      border-radius: 30px;
    }

    #kernel-options label {
      cursor: pointer;
      font-weight: bold;
    }

    #jeilbrek {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      border: none;
      padding: 12px 35px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
      transition: all 0.2s;
    }

    #jeilbrek:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
    }

    .autoJb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    /* إخفاء صورة القطة والكونسول */
    .media-box, #console, .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Original Host</h1>
    

    <hr>

    <div class="btn-container">
    <form id="kernel-options">
      <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
      <label for="netctrl-exploit">NetCtrl</label>
      <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
      <label for="lapse-exploit">Lapse</label>
    </form>
    <button id="jeilbrek">Jeilbrek</button>
    <div class="autoJb">
      <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
      <input class="mt-2" id="autoJbInput" type="checkbox">
    </div>
  </div>

  <div class="main-layout">
    <div class="media-box">
      <img src="includes/cat.jpg" alt="A cat staring at you">
    </div>

    <pre id="console">Ready. Awaiting execution...
  </pre>


  </div>


  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
